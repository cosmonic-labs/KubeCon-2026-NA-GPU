build:
  # Plugs in the prebuilt llama.cpp engine from vendor/ (see llama.wit).
  command: >-
    cargo build --target wasm32-wasip3 --release &&
    wac plug target/wasm32-wasip3/release/llama_chat.wasm --plug vendor/llama-cpp.wasm -o target/llama-chat.wasm
  component_path: target/llama-chat.wasm

dev:
  # Running as a service gives one long-lived instance that also takes the HTTP
  # traffic, so the model stays loaded between requests.
  service_file: target/llama-chat.wasm
  wasi_webgpu: true
  # The engine uses wasm exceptions, and both components use the async component model.
  wasm_proposals: [exception-handling, component-model-async]
  volumes:
    - host_path: models
      guest_path: /models
