[package]
name = "llama-chat"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
futures = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# wit-bindgen must match the version wasip3 uses, so that both share one async runtime.
wasip3 = "0.9.0"
# inter-task-wakeup: a request waiting for the engine is woken by a different export task.
wit-bindgen = { version = "0.62.0", features = ["async-spawn", "inter-task-wakeup"] }

[workspace]

[profile.release]
opt-level = "s"
lto = true
strip = true
